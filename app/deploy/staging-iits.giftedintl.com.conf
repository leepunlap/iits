# staging-iits.giftedintl.com
#
# Draft only — review against the conventions in the live iits vhost before using.
# Covered by the existing wildcard cert (*.giftedintl.com, acme.sh / DNS-01), so no
# certificate work is needed for this hostname.
#
# NOT PUBLIC. The corpus includes 195 imported articles that nobody has reviewed for
# publication. This allowlists loopback, LAN and the tailnet so it is reachable from
# Bernard's devices over Tailscale and invisible to the internet and to crawlers.
# X-Robots-Tag is a request, not a boundary — the allowlist is the boundary.

server {
    listen 80;
    listen [::]:80;
    server_name staging-iits.giftedintl.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging-iits.giftedintl.com;

    include snippets/ssl-giftedintl.inc;

    root /var/www/iits-staging;
    index index.html;

    # --- access boundary -------------------------------------------------------
    allow 127.0.0.1;
    allow ::1;
    allow 100.64.0.0/10;      # tailnet
    # allow <LAN CIDR>;       # set to match the other vhosts on this box
    deny all;
    # ---------------------------------------------------------------------------

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Same class of bug we closed on the live site: keep dotfiles and Apple strays
    # unreachable by rule, so a stray .DS_Store or .git can never enumerate this tree.
    location ~ /\.(?!well-known) { deny all; access_log off; }
    location ~ /\._           { deny all; access_log off; }

    # Article service.
    location /news/ {
        proxy_pass http://127.0.0.1:5099;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin — guarded by the EXISTING auth service, not by anything the app does.
    #
    # The app has no login of its own. It reads X-Auth-User and trusts it, which is
    # only sound because the app binds to 127.0.0.1. If auth_request is ever removed
    # from this block, /admin/ becomes world-writable. Treat these two directives as
    # load-bearing.
    #
    # _verify below is a placeholder: point it at whichever checker.py endpoint
    # authorises the admin role. If checker.py cannot return a username yet, drop the
    # auth_request_set / proxy_set_header pair and the app falls back to "admin".
    location /admin/ {
        auth_request /admin/_verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;

        proxy_pass http://127.0.0.1:5099;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Auth-User       $auth_user;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin/_verify {
        internal;
        proxy_pass http://127.0.0.1:8790/admin/verify;   # confirm the real path
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Media migrated from ycltesthk (441 referenced files, ~366 MB).
    location /media/ {
        alias /var/www/iits-staging/media/;
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
