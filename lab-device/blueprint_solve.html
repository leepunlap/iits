<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>Blueprint solver</title></head>
<body>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { buildModel } from './parts3d.js';

const W = 240, H = 180;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.setClearColor(0xffffff, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(22, W / H, 0.05, 5000);
scene.add(new THREE.AmbientLight(0xffffff, 3));

const lineMat = new THREE.LineBasicMaterial({ color: 0x000000 });
const solidMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

/** Draw the model as a line drawing with hidden lines removed (white solids + black edges). */
function buildEdgeModel(model) {
  const root = buildModel(model);
  root.updateMatrixWorld(true);            // without this every part renders at the origin
  const out = new THREE.Group();
  root.children.forEach((part) => {
    part.traverse((n) => {
      if (n.isMesh && n.geometry) {
        const solid = new THREE.Mesh(n.geometry, solidMat);
        solid.matrixAutoUpdate = false; solid.matrix.copy(n.matrixWorld);
        out.add(solid);
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(n.geometry, 18), lineMat);
        edges.matrixAutoUpdate = false; edges.matrix.copy(n.matrixWorld);
        out.add(edges);
      }
    });
  });
  return out;
}

function setCamera(cam, centre, radius) {
  const az = (cam.az * Math.PI) / 180, el = (cam.el * Math.PI) / 180;
  const fit = radius / Math.sin((camera.fov * Math.PI) / 360);
  const dist = fit * (cam.zoom ?? 1);
  camera.position.set(
    centre.x + dist * Math.cos(el) * Math.sin(az),
    centre.y + dist * Math.sin(el),
    centre.z + dist * Math.cos(el) * Math.cos(az));
  camera.lookAt(centre);
  camera.updateMatrixWorld();
}

/** Render one candidate and return its dark (line) pixels as a Uint8Array mask. */
function renderMask(group, cam) {
  scene.add(group);
  const box = new THREE.Box3().setFromObject(group);
  const centre = box.getCenter(new THREE.Vector3());
  const radius = Math.max(0.5, box.getBoundingSphere(new THREE.Sphere()).radius);
  setCamera(cam, centre, radius);
  renderer.render(scene, camera);
  const gl = renderer.getContext();
  const px = new Uint8Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
  scene.remove(group);
  const mask = new Uint8Array(W * H);
  for (let y = 0; y < H; y += 1) {
    for (let x = 0; x < W; x += 1) {
      const i = ((H - 1 - y) * W + x) * 4;          // readPixels is bottom-up
      mask[y * W + x] = (px[i] < 128 || px[i + 1] < 128 || px[i + 2] < 128) ? 1 : 0;
    }
  }
  return mask;
}

/** Two-pass chamfer distance transform (3-4 approximation), in pixels. */
function distanceTransform(mask) {
  const INF = 1e6;
  const d = new Float32Array(W * H);
  for (let i = 0; i < W * H; i += 1) d[i] = mask[i] ? 0 : INF;
  const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? INF : d[y * W + x];
  for (let y = 0; y < H; y += 1) for (let x = 0; x < W; x += 1) {
    const i = y * W + x;
    d[i] = Math.min(d[i], at(x - 1, y) + 3, at(x, y - 1) + 3, at(x - 1, y - 1) + 4, at(x + 1, y - 1) + 4);
  }
  for (let y = H - 1; y >= 0; y -= 1) for (let x = W - 1; x >= 0; x -= 1) {
    const i = y * W + x;
    d[i] = Math.min(d[i], at(x + 1, y) + 3, at(x, y + 1) + 3, at(x + 1, y + 1) + 4, at(x - 1, y + 1) + 4);
  }
  for (let i = 0; i < W * H; i += 1) d[i] /= 3;
  return d;
}

const count = (m) => { let n = 0; for (let i = 0; i < m.length; i += 1) n += m[i]; return n; };

/** Mean distance from the pixels of `a` to the nearest pixel of `b`, given b's transform. */
function chamfer(a, dtB) {
  let sum = 0, n = 0;
  for (let i = 0; i < a.length; i += 1) if (a[i]) { sum += dtB[i]; n += 1; }
  return n ? sum / n : Infinity;
}

/**
 * Load the blueprint, cut off the parts-list box, extract thin EDGES (not dark fills - a blue beam
 * would otherwise become a solid blob) and normalise the drawing into the canvas by its ink bbox.
 */
function targetMask(img) {
  const src = document.createElement('canvas');
  src.width = img.width; src.height = img.height;
  const sctx = src.getContext('2d');
  sctx.drawImage(img, 0, 0);
  const data = sctx.getImageData(0, 0, img.width, img.height).data;
  const W0 = img.width, H0 = img.height;
  const lum = (x, y) => {
    const i = (y * W0 + x) * 4;
    return 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
  };
  // The parts box ends with a long dark horizontal rule. Detecting the rule (not just the blue
  // plate) matters: leaving the rule in adds a full-width line, which then dominates the ink bbox
  // and squashes the whole drawing.
  let boxEnd = 0;
  for (let y = 0; y < H0 * 0.65; y += 1) {
    let dark = 0;
    for (let x = 0; x < W0; x += 1) if (lum(x, y) < 120) dark += 1;
    if (dark > W0 * 0.45) boxEnd = y;
  }
  const y0 = Math.min(H0 - 2, boxEnd + 5);
  const mask0 = new Uint8Array(W0 * H0);
  for (let y = Math.max(1, y0); y < H0 - 1; y += 1) {
    for (let x = 1; x < W0 - 1; x += 1) {
      const gx = lum(x + 1, y) - lum(x - 1, y);
      const gy = lum(x, y + 1) - lum(x, y - 1);
      if (Math.hypot(gx, gy) > 55) mask0[y * W0 + x] = 1;
    }
  }
  return { mask0, W0, H0, boxEnd };
}

/** Resample a mask so its ink bbox fills the canvas (aspect preserved) - kills zoom/pan ambiguity. */
function fitMask(mask0, W0, H0) {
  let minX = W0, minY = H0, maxX = -1, maxY = -1;
  for (let y = 0; y < H0; y += 1) for (let x = 0; x < W0; x += 1) {
    if (mask0[y * W0 + x]) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  const out = new Uint8Array(W * H);
  if (maxX < 0) return out;
  const bw = maxX - minX + 1, bh = maxY - minY + 1;
  const scale = Math.min((W - 10) / bw, (H - 10) / bh);
  const ox = (W - bw * scale) / 2, oy = (H - bh * scale) / 2;
  for (let y = 0; y < H; y += 1) {
    for (let x = 0; x < W; x += 1) {
      const sx = Math.floor((x - ox) / scale) + minX;
      const sy = Math.floor((y - oy) / scale) + minY;
      if (sx >= minX && sx <= maxX && sy >= minY && sy <= maxY) out[y * W + x] = mask0[sy * W0 + sx];
    }
  }
  return out;
}

const TAU = 2;                       // a pixel within 2 px counts as explained

function warpMask(mask, sc, dx, dy, W, H) {
  const out = new Uint8Array(W * H);
  const cx = W / 2, cy = H / 2;
  for (let y = 0; y < H; y += 1) for (let x = 0; x < W; x += 1) {
    const sx = Math.round((x - cx - dx) / sc + cx);
    const sy = Math.round((y - cy - dy) / sc + cy);
    if (sx >= 0 && sx < W && sy >= 0 && sy < H) out[y * W + x] = mask[sy * W + sx];
  }
  return out;
}

function f1Of(mask, targetMask, dtTarget) {
  const dtRender = distanceTransform(mask);
  let both = 0, ronly = 0, tonly = 0;
  for (let i = 0; i < mask.length; i += 1) {
    if (mask[i]) { if (dtTarget[i] <= TAU) both += 1; else ronly += 1; }
  }
  for (let i = 0; i < targetMask.length; i += 1) if (targetMask[i] && dtRender[i] > TAU) tonly += 1;
  const precision = both / Math.max(1, both + ronly);
  const recall = both / Math.max(1, both + tonly);
  return { f1: (2 * precision * recall) / Math.max(1e-9, precision + recall),
           precision, recall, miss: 1 - recall, extra: 1 - precision };
}

/** Fit the render's framing (scale + offset) to the target by maximising edge overlap. */
function alignAndScore(rawMask, targetMask, dtTarget) {
  let best = null;
  for (const sc of [0.6, 0.75, 0.9, 1.0, 1.1, 1.25, 1.45, 1.7]) {
    for (let dx = -34; dx <= 34; dx += 4) {
      for (let dy = -34; dy <= 34; dy += 4) {
        const m = warpMask(rawMask, sc, dx, dy, W, H);
        let n = 0; for (let i = 0; i < m.length; i += 1) n += m[i];
        if (n < 60) continue;
        const r = f1Of(m, targetMask, dtTarget);
        if (!best || r.f1 > best.f1) best = Object.assign(r, { sc, dx, dy, mask: m });
      }
    }
  }
  return best || { f1: 0, precision: 0, recall: 0, miss: 1, extra: 1, sc: 1, dx: 0, dy: 0, mask: rawMask };
}

window.__solve = async (req) => {
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = req.image; });
  const raw = targetMask(img);
  const target = { mask: fitMask(raw.mask0, raw.W0, raw.H0), boxEnd: raw.boxEnd };
  const dtTarget = distanceTransform(target.mask);
  const diag = Math.hypot(W, H);
  const TAU = 2;                                        // a pixel within 2 px counts as explained
  const score = (group, cam) => {
    const raw = renderMask(group, cam);
    const fit = alignAndScore(raw, target.mask, dtTarget);
    if (!fit) return { total: Infinity, forward: Infinity, backward: Infinity, miss: 1, extra: 1, edgePixels: 0 };
    const mask = fit.mask || null;
    return { forward: fit.miss, backward: fit.extra, total: 1 - fit.f1, miss: fit.miss, extra: fit.extra,
             f1: fit.f1, precision: fit.precision, recall: fit.recall,
             edgePixels: count(mask || raw) };
  };

  const built = req.hypotheses.map((h) => ({ name: h.name, group: buildEdgeModel(h.model) }));
  const refGroup = buildEdgeModel(req.reference);

  // 1) camera search on the reference model
  let cameraBest = null;
  for (const cam of req.camSearch) {
    const s = score(refGroup, cam);
    if (!cameraBest || s.total < cameraBest.score.total) cameraBest = { cam, score: s };
  }
  // 2) rank the hypotheses with the winning camera
  const ranked = built.map((h) => {
    const s = score(h.group, cameraBest.cam);
    return { name: h.name, total: s.total, forward: s.forward, backward: s.backward,
             miss: s.miss, extra: s.extra, edgePixels: s.edgePixels };
  }).sort((a, b) => a.total - b.total);
  return {
    target: { partsBoxEndRow: target.boxEnd, edgePixels: count(target.mask) },
    camera: cameraBest,
    ranked,
  };
};
/** Debug: what the solver believes the blueprint's edges are, and what it rendered. */
window.__debugImages = async (req) => {
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = req.image; });
  const rawT = targetMask(img);
  const target = { mask: fitMask(rawT.mask0, rawT.W0, rawT.H0) };
  const shown = document.createElement('canvas'); shown.width = W; shown.height = H;
  const sctx = shown.getContext('2d');
  const id2 = sctx.createImageData(W, H);
  for (let i = 0; i < W * H; i += 1) {
    const v = target.mask[i] ? 0 : 255;
    id2.data[i * 4] = v; id2.data[i * 4 + 1] = v; id2.data[i * 4 + 2] = v; id2.data[i * 4 + 3] = 255;
  }
  sctx.putImageData(id2, 0, 0);
  const group = buildEdgeModel(req.model);
  const cam = req.cam || { az: 45, el: 40, zoom: 1 };
  scene.add(group);
  const box = new THREE.Box3().setFromObject(group);
  const centre = box.getCenter(new THREE.Vector3());
  const radius = Math.max(0.5, box.getBoundingSphere(new THREE.Sphere()).radius);
  setCamera(cam, centre, radius);
  renderer.render(scene, camera);
  const renderUrl = renderer.domElement.toDataURL('image/png');
  scene.remove(group);
  return { target: shown.toDataURL('image/png'), render: renderUrl,
           bbox: [box.min.x, box.min.y, box.min.z, box.max.x, box.max.y, box.max.z], radius };
};
/** Overlay: blueprint edges in red, render edges in blue, agreement in black. */
window.__overlay = async (req) => {
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = req.image; });
  const rawT = targetMask(img);
  const target = fitMask(rawT.mask0, rawT.W0, rawT.H0);
  const group = buildEdgeModel(req.model);
  const targetDT = distanceTransform(target);
  const rawR = renderMask(group, req.cam);
  const fit = alignAndScore(rawR, target, targetDT);
  const render = fit.mask || rawR;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const idata = ctx.createImageData(W, H);
  for (let i = 0; i < W * H; i += 1) {
    const t = target[i], r = render[i];
    const c = t && r ? [0, 0, 0] : t ? [220, 40, 40] : r ? [40, 90, 220] : [255, 255, 255];
    idata.data[i*4] = c[0]; idata.data[i*4+1] = c[1]; idata.data[i*4+2] = c[2]; idata.data[i*4+3] = 255;
  }
  ctx.putImageData(idata, 0, 0);
  let both = 0, tonly = 0, ronly = 0;
  for (let i = 0; i < W * H; i += 1) {
    if (target[i] && render[i]) both += 1; else if (target[i]) tonly += 1; else if (render[i]) ronly += 1;
  }
  return { png: cv.toDataURL('image/png'), both, tonly, ronly,
           recall: both / Math.max(1, both + tonly), precision: both / Math.max(1, both + ronly) };
};
window.__ready = true;
</script>
</body>
