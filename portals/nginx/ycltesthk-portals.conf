# Any other name under the wildcard: send it to the main site (on the IIS box).
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    include snippets/ssl-ycltesthk.inc;
    server_name *.ycltesthk.com;
    return 302 https://ycltesthk.com/;
}
