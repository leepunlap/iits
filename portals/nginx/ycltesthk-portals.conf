# teachers.ycltesthk.com and students.ycltesthk.com — two SEPARATE sites (owner, 2026-09-25), each with
# its own docroot under /var/www/ycltesthk-portals/, served at the root (/login.html, /api/, /files/).
# Source of truth: ~/ycltesthk-portals (this file = nginx/ycltesthk-portals.conf); deploy with ./deploy.sh.
# Sign-up / forgot password: backend/reg.py (iits-portal-reg, 127.0.0.1:8794) — see README.
#
# The login/file backend (iits-teacher-auth, 127.0.0.1:8790), the accounts (/etc/iits-teacher-auth/*.json) and the
# class file store (/var/www/iits/classfiles) used to be shared with the old /teacher/ + /student/ portals on
# iits.giftedintl.com, iits.roadlogica.com and bernard.giftedintl.com; those were retired 2026-09-26 and now only
# forward here. (staging-iits.giftedintl.com still uses the backend's separate "admin" realm for its article UI.)
#
# Cookies: the backend scopes each realm's cookie to /teacher/ or /student/ because on
# iits.giftedintl.com three realms (teacher, student, admin) share ONE hostname. Here every hostname
# carries exactly one realm and serves nothing else, so the hostname is the isolation and the cookie is
# re-scoped to "/" (proxy_cookie_path). Never add another realm's routes (or /admin/) to these hosts.
#
# Cache (2026-10-07): lesson pages and their css/js/json under /files/ must revalidate every time (a cheap 304 when
# unchanged) so a rebuild reaches students at once; the pages also ask for css/js with ?v=<content hash>. Images and
# class files keep normal browser caching (empty value = no header).
map $uri $iits_files_cc { ~*/assets/lab/engine-[0-9a-f]+/ "public, max-age=31536000, immutable"; ~*\.(html|css|js|json)$ "no-cache"; default ""; }

# DNS: only the DNSPod "*" record points at this box (ycltesthk-ddns.sh); ycltesthk.com and www are the
# Windows/IIS web server and the mail names are AdvanHost. Cert: *.ycltesthk.com (deploy-ycltesthk.sh).

server {
    listen 80;
    listen [::]:80;
    server_name teachers.ycltesthk.com students.ycltesthk.com;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------ teachers
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    include snippets/ssl-ycltesthk.inc;
    server_name teachers.ycltesthk.com;
    include snippets/allow-edge.inc;
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 300m;
    root /var/www/ycltesthk-portals/teachers;

    # sign-up + forgot password (iits-portal-reg :8794) — the realm comes from THIS hostname, never the client
    location = /register.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /forgot.html   { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location /assets/ { add_header Cache-Control "public, max-age=300"; }
    location /api/reg/ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8794/;
        proxy_set_header X-Portal-Realm teacher;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Auth-User "";
    }
    # classes, rosters, join codes, teacher admin: logged-in teachers only; the identity comes from the
    # login check, never the client (the reg service then decides admin / assigned-class rights)
    location ~ ^/api/reg/(classes|teachers)(/|$) {
        client_max_body_size 64k;
        auth_request /_verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        rewrite ^/api/reg/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8794;
        proxy_set_header X-Portal-Realm teacher;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Auth-User $auth_user;
    }

    # materials are published by the build pipeline; the portal is download-only (owner 2026-10-03)
    location ~ ^/api/fm/(upload|delete|rename)$ { return 403; }
    location /api/ {
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8790/;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Realm teacher;
        proxy_cookie_path /teacher/ /;
    }
    # Host = this site's name: the login service honours self-registered teacher accounts only here
    location = /_verify {
        internal;
        proxy_pass http://127.0.0.1:8790/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Realm teacher;
    }
    # per-level file gate: a teacher may open the materials of the classes assigned to them (admins: all)
    location = /_fverify {
        internal;
        proxy_pass http://127.0.0.1:8790/fverify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Realm teacher;
        proxy_set_header X-Original-URI $request_uri;
    }
    # AI 學伴 on the lesson pages (iits-lesson-ai :8811). The path carries files/<LEVEL>/lessons/<slug>, so the
    # existing per-level file gate decides access and hands over the verified user; the model key never leaves the box.
    location ~ ^/api/ai/(chat|status)/files/(L[1-4])/lessons/([a-z0-9]+-bp[0-9]+)$ {
        auth_request /_fverify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        client_max_body_size 24k;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8811/$1/files/$2/lessons/$3;
        proxy_set_header X-Auth-User $auth_user;
        proxy_set_header Cookie "";
        proxy_set_header X-Auth-Realm teacher;   # class timetable lookup (2026-10-07)
    }
    # Wonder Lab (L4 vibe coding, 2026-10-07): GET = availability + last program, POST = one lab turn; same per-level gate
    location ~ ^/api/ai/lab/files/(L4)/lessons/([a-z0-9]+-bp[0-9]+)$ {
        auth_request /_fverify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        client_max_body_size 64k;            # the program travels with each turn (chat stays at 24k)
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8811/lab/files/$1/lessons/$2;
        proxy_set_header X-Auth-User $auth_user;
        proxy_set_header X-Auth-Realm teacher;
        proxy_set_header Cookie "";
    }
    location = /login.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /favicon.ico { access_log off; log_not_found off; return 204; }
    location ~ ^/files/([^/]+)/([^/]+)/(.+)$ {
        auth_request /_fverify;
        error_page 401 = @login;
        alias /var/www/iits/classfiles/$1/$2/$3;
        add_header Cache-Control $iits_files_cc;
        gzip_static on;                      # Wonder Lab engine etc. are pre-compressed by the build (2026-10-07)
    }
    location /files/ { return 404; }
    location / {
        auth_request /_verify;
        error_page 401 = @login;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }
    location @login { return 302 /login.html; }
}

