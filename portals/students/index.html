<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>我的課程 · 工信學堂 IITS</title>
<style>
/* icons (2026-10-07) */
.si{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-0.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans TC',-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;color:#10161d;
  background:linear-gradient(160deg,#eafaf3,#eef4ff);display:flex;flex-direction:column;overflow:hidden}
/* ---- top bar ---- */
.top{flex:none;position:relative;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid #dcefe4;padding:9px 14px;display:flex;align-items:center;gap:10px}
.top b{font-size:15px}
.top .who{font-size:12.5px;color:#5a7d6e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .brand{font-size:11.5px;color:#8aa79a}
.btn{margin-left:auto;border:1px solid #cfe6da;background:#fff;color:#2f8f6b;border-radius:999px;
  padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;flex:none}
.btn:hover{background:#effaf4}
/* ---- hero ---- */
.hero{flex:none;padding:11px clamp(12px,2vw,22px) 0}
.chero{display:flex;align-items:center;gap:13px;background:linear-gradient(135deg,#fff,#f2fbf6);
  border:1px solid #d9efe3;border-radius:16px;padding:11px 15px}
.cpill{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:48px;padding:0 13px;
  border-radius:14px;background:#3d5699;color:#fff;font-size:26px;font-weight:900;letter-spacing:1px;
  box-shadow:0 8px 18px -8px rgba(0,0,0,.4);font-family:"Space Grotesk",system-ui,sans-serif}
.ctxt{min-width:0}
.ctxt h1{margin:0 0 1px;font-size:17px;line-height:1.35}
.ctxt p{margin:0;font-size:12.5px;color:#5a7d6e;white-space:pre-line;line-height:1.5}
/* ---- class tabs (student in >1 class) ---- */
.gtabs{flex:none;display:flex;gap:7px;flex-wrap:wrap;padding:10px clamp(12px,2vw,22px) 0}
.gtab{border:1px solid #cfe6da;background:#fff;color:#2f8f6b;border-radius:999px;padding:5px 12px;
  font:inherit;font-size:12.5px;cursor:pointer}
.gtab.on{background:#2f8f6b;border-color:#2f8f6b;color:#fff;font-weight:700}
/* ---- section tabs ---- */
.tabs{flex:none;display:flex;gap:6px;padding:10px clamp(12px,2vw,22px) 0;overflow-x:auto}
.tab{border:0;background:transparent;color:#5a7d6e;border-radius:10px 10px 0 0;padding:9px 14px;
  font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tab.on{color:#2f8f6b;font-weight:800;background:#fff;border-bottom-color:#2f8f6b}
/* ---- panes ---- */
.body{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 clamp(12px,2vw,22px) 12px}
.pane{display:none;flex:1;min-height:0;flex-direction:column}
.pane.on{display:flex}
.frame{flex:1;min-height:0;background:#fff;border:1px solid #e4eef0;border-top:0;border-radius:0 12px 12px 12px;
  overflow:hidden}
.frame iframe{width:100%;height:100%;border:0;display:block}
.list{display:grid;gap:9px;grid-template-columns:1fr;padding:12px;align-items:start;overflow:auto;flex:1;min-height:0;
  background:#fff;border:1px solid #e4eef0;border-top:0;border-radius:0 12px 12px 12px}
@media(min-width:760px){.list{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}}
.row{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid #eef4f1;border-radius:12px;background:#fff}
.row .ic{font-size:19px}
.row .nm{flex:1;min-width:0;font-size:13px;line-height:1.4;word-break:break-all;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .badge{display:inline-block;background:#eef4ff;color:#3d5699;font-size:10.5px;font-weight:700;
  border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:middle}
.row .sz{font-size:11px;color:#9aa9a2;white-space:nowrap}
.row a{border:1px solid #cfe6da;color:#2f8f6b;border-radius:999px;padding:6px 13px;font-size:12.5px;
  text-decoration:none;white-space:nowrap}
.row a:hover{background:#effaf4}
.empty{padding:22px 16px;color:#9aa9a2;font-size:13px;text-align:center;grid-column:1/-1}
.note{padding:11px 16px;font-size:12px;color:#8a93a3;line-height:1.6}
@media(max-width:520px){.cpill{min-width:46px;height:42px;font-size:22px}.ctxt h1{font-size:15px}}
/* ---- phones: nothing wider than the screen, compact header so the lesson gets the space ---- */
.top b,.btn{white-space:nowrap}
.top .who{flex:1;min-width:0}
.ctxt{flex:1}.ctxt h1,.ctxt p{overflow-wrap:anywhere}
@media(max-width:640px){
  .top{padding:7px 10px;gap:8px}.top b{font-size:14px}.top .brand{display:none}
  .btn{padding:5px 11px;font-size:12px}
  .hero{padding:8px 10px 0}.chero{padding:8px 11px;gap:10px;border-radius:13px}
  .cpill{min-width:40px;height:36px;font-size:18px;padding:0 9px;border-radius:10px}
  .ctxt h1{font-size:14px}.ctxt p{font-size:11.5px;line-height:1.45}
  .tabs{padding:7px 10px 0;gap:2px}.tab{padding:7px 10px;font-size:13px}
  .body{padding:0 10px 8px}.gtabs{padding:7px 10px 0}
}
/* AI 學伴 opened on a phone: the lesson frame takes the whole screen so the chat sits above the keyboard */
html.chatfull .frame{position:fixed;inset:0;z-index:100;border:0;border-radius:0;height:100%;height:100dvh}
</style></head><body>
<div class="top">
  <b><svg class="si" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/> <path d="M8 10h8"/> <path d="M8 18h8"/> <path d="M8 22v-6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v6"/> <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg> 我的課程</b>
  <span class="who" id="whoami"></span>
  <span class="brand">工信學堂 · IITS</span>
  <button class="btn" onclick="logout()">登出</button>
</div>

<div class="hero">
  <div class="chero">
    <span class="cpill" id="cpill">··</span>
    <div class="ctxt"><h1 id="cname">載入中…</h1><p id="csub"></p></div>
  </div>
</div>
<div class="gtabs" id="gtabs" style="display:none"></div>

<div class="tabs">
  <button class="tab on" data-p="lessons"><svg class="si" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v16"/> <path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></svg> 課程</button>
  <button class="tab" data-p="software"><svg class="si" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 15V3"/> <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/> <path d="m7 10 5 5 5-5"/></svg> 軟件下載</button>
  <button class="tab" data-p="files"><svg class="si" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/> <path d="M14 2v5a1 1 0 0 0 1 1h5"/> <path d="M10 9H8"/> <path d="M16 13H8"/> <path d="M16 17H8"/></svg> 班級檔案</button>
</div>

<div class="body">
  <div class="pane on" id="pane-lessons"><div class="frame"><iframe id="lframe" title="課程" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div></div>
  <div class="pane" id="pane-software"><div class="list" id="list-sw"><div class="empty">載入中…</div></div>
    <div class="note"><svg class="si" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/> <path d="M9 18h6"/> <path d="M10 22h4"/></svg> 不確定 Mac 型號？左上角  → 「關於本機」看晶片：Apple M 系列選「Apple Silicon」，Intel 選「Intel」。</div></div>
  <div class="pane" id="pane-files"><div class="list" id="list-st"><div class="empty">載入中…</div></div></div>
</div>

<script>
const IC={"monitor": "<rect width=\"20\" height=\"14\" x=\"2\" y=\"3\" rx=\"2\"/> <line x1=\"8\" x2=\"16\" y1=\"21\" y2=\"21\"/> <line x1=\"12\" x2=\"12\" y1=\"17\" y2=\"21\"/>", "laptop": "<path d=\"M18 5a2 2 0 0 1 2 2v8.526a2 2 0 0 0 .212.897l1.068 2.127a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45l1.068-2.127A2 2 0 0 0 4 15.526V7a2 2 0 0 1 2-2z\"/> <path d=\"M20.054 15.987H3.946\"/>", "book": "<path d=\"M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20\"/>", "presentation": "<path d=\"M2 3h20\"/> <path d=\"M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3\"/> <path d=\"m7 21 5-5 5 5\"/>", "file-text": "<path d=\"M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z\"/> <path d=\"M14 2v5a1 1 0 0 0 1 1h5\"/> <path d=\"M10 9H8\"/> <path d=\"M16 13H8\"/> <path d=\"M16 17H8\"/>", "paperclip": "<path d=\"m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551\"/>", "calendar-days": "<path d=\"M8 2v3\"/> <path d=\"M16 2v3\"/> <rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/> <path d=\"M3 9h18\"/> <path d=\"M8 13h.01\"/> <path d=\"M12 13h.01\"/> <path d=\"M16 13h.01\"/> <path d=\"M8 17h.01\"/> <path d=\"M12 17h.01\"/> <path d=\"M16 17h.01\"/>"};
const I=n=>'<svg class="si" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+IC[n]+'</svg>';  // single-colour Lucide icons (ISC), owner 2026-10-07: no emoji

const CN={L1:"一級 · 動力工程＋創意製造",L2:"二級 · 程序交互＋傳感控制",L3:"三級 · 智能控制＋智能創造",L4:"四級 · 創造大師＋程序應用",yai:"YAI · 無廢城市競賽"};
const PC={L1:'#3d5699',L2:'#2f8f6b',L3:'#d9772e',L4:'#7c4dc4',yai:'#2ea052'};
// levels that have a generated lesson library (pure static HTML under classfiles/<LEVEL>/lessons/)
const HAS_LESSONS={L1:1,L2:1,L3:1,L4:1};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function api(p,o){return fetch('/api/'+p,Object.assign({credentials:'same-origin'},o||{}));}
function logout(){api('logout',{method:'POST'}).finally(()=>location.href='/login.html');}
function fmt(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':b>=1024?(b/1024).toFixed(0)+' KB':b+' B';}
function osInfo(n){n=n.toLowerCase();
  if(n.indexOf('win')>=0||n.endsWith('.exe'))return[I('monitor'),'Windows'];
  if(n.indexOf('arm64')>=0)return[I('laptop'),'Mac · Apple Silicon'];
  if(n.indexOf('x64')>=0&&n.indexOf('mac')>=0)return[I('laptop'),'Mac · Intel'];
  if(n.endsWith('.dmg')||n.endsWith('.pkg'))return[I('laptop'),'Mac'];
  if(n.endsWith('.pdf'))return[I('book'),''];if(/\.(pptx?|key)$/.test(n))return[I('presentation'),''];if(/\.(docx?)$/.test(n))return[I('file-text'),''];
  return[I('paperclip'),''];}
async function render(u,sec,listId,withBadge,emptyMsg){
  const el=document.getElementById(listId);
  let j;try{j=await (await api('fm/list?class='+encodeURIComponent(u)+'&section='+sec)).json();}catch(e){el.innerHTML='<div class="empty">載入失敗</div>';return;}
  const files=j.files||[];
  if(!files.length){el.innerHTML='<div class="empty">'+emptyMsg+'</div>';return;}
  el.innerHTML=files.map(f=>{const url='/files/'+u+'/'+sec+'/'+encodeURIComponent(f.name);const oi=osInfo(f.name);
    const badge=withBadge&&oi[1]?`<span class="badge">${oi[1]}</span>`:'';
    return `<div class="row"><span class="ic">${oi[0]}</span><span class="nm">${badge}${esc(f.name)}</span>
      <span class="sz">${fmt(f.size)}</span><a href="${url}" target="_blank" rel="noopener">${sec==='software'?'下載':'開啟'}</a></div>`;}).join('');
}
const WD='日一二三四五六';
function nextLesson(s){const n=new Date(),t=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');return (s||[]).find(x=>x.date>=t);}
function lessonText(x){const p=x.date.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]);return p[1]+'月'+p[2]+'日（'+WD[d.getDay()]+'）'+(x.start?' '+x.start+'–'+x.end:'');}

// ---- where the student is lives in the URL: #<class>/<tab>[/<lesson>] — a refresh (or a copied link) lands on the same page ----
const TABS=['lessons','software','files'];
// lesson pages are opened with ?v=<this visit> so a copy cached before the no-cache header can never be shown
const BOOT=Date.now().toString(36);
let TAB='lessons',LESSON='';
function readHash(){const h=decodeURIComponent(location.hash.slice(1)).split('/');
  return {cls:h[0]||'',tab:TABS.includes(h[1])?h[1]:'',les:/^\d{3}-bp\d{2}$/.test(h[2]||'')?h[2]:''};}
function saveState(){if(!CUR)return;const h='#'+CUR+'/'+TAB+(TAB==='lessons'&&LESSON?'/'+LESSON:'');
  if(location.hash!==h)history.replaceState(null,'',h);}
function setTab(p){TAB=TABS.includes(p)?p:'lessons';
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.p===TAB));
  document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id==='pane-'+TAB));}

// ---- section tabs ----
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{setTab(b.dataset.p);saveState();});

// follow the student inside the lesson library (prev/next, lesson picker) and keep the URL in step
document.getElementById('lframe').addEventListener('load',function(){
  let p='';try{p=this.contentWindow.location.pathname;}catch(e){return;}
  const m=p.match(/^\/files\/([^/]+)\/lessons\/(?:(\d{3}-bp\d{2})\/)?(?:index\.html)?$/);
  if(!m||m[1]!==CUR)return;
  LESSON=m[2]||'';saveState();
});

let CUR=null;
function show(me,g,les){
  const cls=g?g.level:((me.classes&&me.classes[0])||me.u);
  CUR=cls;
  document.getElementById('whoami').textContent=me.name?('· '+me.name):'';
  document.getElementById('cname').textContent=me.name?(me.name+'，你好！'):(g?g.label:(CN[cls]||cls));
  let line=(g?g.label:(CN[cls]||cls));
  if(g&&g.schedule)line+=' · '+g.schedule;
  const nx=g&&g.status!=='archived'&&nextLesson(g.sessions);
  if(nx)line+='\n\u0001下一課：'+lessonText(nx);
  document.getElementById('csub').innerHTML=esc(line).replace('\u0001',I('calendar-days')+' ');
  const pl=document.getElementById('cpill');pl.textContent=cls;pl.style.background=PC[cls]||'#3d5699';

  // lesson library (generated HTML) or fall back to class files when the level has none
  const fr=document.getElementById('lframe');
  LESSON=les||'';
  if(HAS_LESSONS[cls]){
    if(LESSON){try{sessionStorage.setItem('iits-restore','/files/'+cls+'/lessons/'+LESSON+'/index.html');}catch(e){}}
    fr.src='/files/'+cls+'/lessons/'+(LESSON?LESSON+'/':'')+'index.html?v='+BOOT;
    document.getElementById('pane-lessons').querySelector('.frame').style.display='';
  }else{
    fr.removeAttribute('src');fr.src='about:blank';
    document.getElementById('pane-lessons').querySelector('.frame').innerHTML=
      '<div class="empty" style="padding:40px 16px">這一班暫未提供網上課程，請看「'+I('file-text')+' 班級檔案」。</div>';
  }
  render(cls,'software','list-sw',true,'老師尚未提供軟件。');
  render(cls,'student','list-st',false,'老師尚未上傳檔案。');
}
(async()=>{
  let me;try{me=await (await api('me')).json();}catch(e){location.href='/login.html';return;}
  if(!me||!me.u){location.href='/login.html';return;}
  const groups=me.groups||[];
  const st=readHash();
  let g0=groups.find(g=>g.level===st.cls)||groups[0];
  const startCls=g0?g0.level:((me.classes&&me.classes[0])||me.u);
  if(groups.length>1){
    const bar=document.getElementById('gtabs'),seen={};
    groups.forEach((g,i)=>{
      if(seen[g.label])return; seen[g.label]=1;
      const b=document.createElement('button');b.className='gtab'+(g===g0?' on':'');b.textContent=g.label;b.dataset.lv=g.level;
      b.onclick=()=>{[...bar.children].forEach(x=>x.classList.toggle('on',x===b));show(me,g,'');saveState();};
      bar.appendChild(b);
    });
    bar.style.display='';
  }
  show(me,g0,st.cls===startCls?st.les:'');
  setTab(st.cls===startCls&&st.tab?st.tab:'lessons');
  saveState();
  // a link pasted or edited while the page is open
  window.addEventListener('hashchange',()=>{
    const s2=readHash();const g=groups.find(x=>x.level===s2.cls);
    if(g&&g.level!==CUR){const b=[...document.getElementById('gtabs').children].find(x=>x.dataset.lv===g.level);
      if(b)[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b));show(me,g,s2.les);}
    else if(s2.cls===CUR&&s2.les!==LESSON&&HAS_LESSONS[CUR]){LESSON=s2.les;
      document.getElementById('lframe').src='/files/'+CUR+'/lessons/'+(LESSON?LESSON+'/':'')+'index.html?v='+BOOT;}
    setTab(s2.tab||TAB);saveState();
  });
})();
</script></body></html>
