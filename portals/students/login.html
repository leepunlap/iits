<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>學生登入 · 工信學堂 IITS</title>
<style>
/* icons (2026-10-07) */
.si{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-0.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",sans-serif;
    color:#10161d;background:#f7f6f2;background-image:radial-gradient(1200px 600px at 50% -10%,#eef1f8,transparent);padding:20px}
  .card{width:100%;max-width:390px;background:#fff;border:1px solid #e7e9ee;border-radius:18px;
    box-shadow:0 24px 60px -30px rgba(16,22,29,.35);padding:38px 32px 30px}
  .brand{font-size:.78em;letter-spacing:.16em;color:#2f8f6b;font-weight:700;text-transform:uppercase;margin-bottom:6px}
  h1{font-size:1.5em;margin:0 0 4px}
  .sub{color:#69707a;font-size:.9em;margin-bottom:26px}
  label{display:block;font-size:.82em;color:#4a5158;margin:0 0 6px;font-weight:500}
  .field{margin-bottom:16px}
  input[type=text],input[type=password]{width:100%;height:48px;border:1px solid #d8dce3;border-radius:11px;
    padding:0 14px;font-size:1em;font-family:inherit;background:#fbfcfd;transition:border-color .15s,box-shadow .15s}
  input:focus{outline:none;border-color:#2f8f6b;box-shadow:0 0 0 3px rgba(47,143,107,.15);background:#fff}
  .row{display:flex;align-items:center;gap:9px;margin:4px 0 22px}
  .row input{width:20px;height:20px;accent-color:#2f8f6b;cursor:pointer}
  .row label{margin:0;font-size:.9em;color:#4a5158;cursor:pointer;font-weight:400}
  button{width:100%;height:50px;border:0;border-radius:11px;background:#2f8f6b;color:#fff;font-size:1.02em;
    font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s}
  button:hover{background:#26795b} button:disabled{opacity:.6;cursor:default}
  .err{color:#c0392b;font-size:.86em;min-height:20px;margin:2px 0 4px;text-align:center}
  .foot{text-align:center;color:#a4abb4;font-size:.76em;margin-top:20px}

  .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .hm{font-size:.78em;color:#69707a;text-decoration:none;cursor:pointer}
  .hm:hover{color:#2f8f6b}
  .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;user-select:none;padding:6px;border-radius:8px;color:#69707a;line-height:0}
  .eye:hover{background:rgba(47,143,107,.1);color:#2f8f6b}
  .eye svg.eye-icon{display:block;width:22px;height:22px}
  .eye .eye-closed{display:none}
  .eye.open .eye-open{display:none}
  .eye.open .eye-closed{display:block}
</style></head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="top-bar"><span class="brand">工信學堂 IITS</span><a class="hm" href="https://ycltesthk.com/"><svg class="si" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/> <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> 回首頁</a></div>
  <h1>學生專區登入</h1>
  <div class="sub">歡迎回來！輸入帳號密碼開始學習。</div>
  <div class="field"><label for="u">帳號</label>
    <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
  <div class="field"><label for="p">密碼</label>
    <div style="position:relative"><input type="password" id="p" name="password" autocomplete="current-password" required style="padding-right:40px">
    <span id="showP" class="eye" onclick="togglePwd()">
      <svg class="eye-icon" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <g class="eye-open">
          <path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z"/>
          <circle cx="10" cy="10" r="2.5"/>
        </g>
        <g class="eye-closed">
          <path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z"/>
          <circle cx="10" cy="10" r="2.5"/>
          <path d="M3 3l14 14"/>
        </g>
      </svg>
    </span></div></div>
  <div class="row"><input type="checkbox" id="rm" checked><label for="rm">記住我（30 天免再登入）</label></div>
  <div class="err" id="err"></div>
  <button type="submit" id="btn">登入</button>
  <div style="text-align:center;font-size:.86em;margin-top:16px"><a href="/forgot.html" style="color:#3d5699;text-decoration:none">忘記密碼？</a><span style="color:#c9ced6;margin:0 10px">·</span><a href="/register.html" style="color:#3d5699;text-decoration:none">註冊新帳號</a></div>
  <div class="foot">工信學堂（香港）· 學生專區</div>
</form>
<script>
  var next = new URLSearchParams(location.search).get('next') || '/';
  if(!/^\/(?![\/\\])/.test(next)) next='/';   // same-site paths only (no //host or /\host open redirects)
  var f=document.getElementById('f'), U=document.getElementById('u'), P=document.getElementById('p'),
      RM=document.getElementById('rm'), ERR=document.getElementById('err'), BTN=document.getElementById('btn');
  // prefill remembered username
  // multi-credential prefill from localStorage
  var creds = JSON.parse(localStorage.getItem('iits_creds')||'{}');
  var keys = Object.keys(creds);
  if(keys.length){
    // Create datalist for username field
    var dl = document.createElement('datalist'); dl.id='iits-users';
    keys.forEach(function(k){ var o=document.createElement('option'); o.value=k; dl.appendChild(o); });
    U.parentNode.insertBefore(dl, U.nextSibling);
    U.setAttribute('list','iits-users');
    U.addEventListener('input', function(){
      if(creds[U.value.trim()]) P.value=creds[U.value.trim()];
    });
    // Pre-fill the last used user
    var last = localStorage.getItem('iits_last_user');
    if(last && creds[last]){ U.value=last; P.value=creds[last]; P.focus(); }
    else { U.value=keys[0]; P.value=creds[keys[0]]; P.focus(); }
  } else { U.focus(); }
  // if already logged in, skip straight in
  fetch('/api/verify',{credentials:'same-origin'}).then(function(r){if(r.ok)location.replace(next);}).catch(function(){});
  f.addEventListener('submit', function(e){
    e.preventDefault(); ERR.textContent=''; BTN.disabled=true; BTN.textContent='登入中…';
    fetch('/api/login',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({u:U.value.trim(),p:P.value,remember:RM.checked})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      if(res.ok && res.j.ok){
        if(RM.checked){var c=JSON.parse(localStorage.getItem('iits_creds')||'{}'); c[U.value.trim()]=P.value.trim(); localStorage.setItem('iits_creds',JSON.stringify(c)); localStorage.setItem('iits_last_user',U.value.trim())}
        else {var c=JSON.parse(localStorage.getItem('iits_creds')||'{}'); delete c[U.value.trim()]; localStorage.setItem('iits_creds',JSON.stringify(c)); localStorage.removeItem('iits_last_user')}
        location.replace(next);
      } else { ERR.textContent='帳號或密碼錯誤，請重試。'; BTN.disabled=false; BTN.textContent='登入'; P.value=''; P.focus(); }
    })
    .catch(function(){ ERR.textContent='連線錯誤，請稍後再試。'; BTN.disabled=false; BTN.textContent='登入'; });
  });
function togglePwd(){var p=document.getElementById("p"),e=document.getElementById("showP");if(p.type==="password"){p.type="text";e.classList.add("open")}else{p.type="password";e.classList.remove("open")}}
</script>
</body></html>
