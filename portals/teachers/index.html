.wlbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;background:#fff;border:1px solid #e5e8f0;border-radius:14px;padding:9px 14px}
.wlsw{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer;user-select:none;position:relative}
.wlsw input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.wlsw i{width:36px;height:20px;border-radius:999px;background:#d7dced;position:relative;transition:.15s;flex:none}
.wlsw i:after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(16,22,29,.25);transition:.15s}
.wlsw input:checked+i{background:#7c4dc4}.wlsw input:checked+i:after{left:18px}
.wlsw input:focus-visible+i{outline:2px solid #3d5699;outline-offset:2px}.wlsw input:disabled+i{opacity:.5}
.wlbar .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.wlhint{font-size:12px;color:#69707a;line-height:1.6;margin:0}

.stg.pending{background:#fff3d6;color:#8a5a00}.stg.step1,.stg.step2{background:#f1e9fb;color:#5a2ea0}.stg.done{background:#eafaf3;color:#2f8f6b}
.stg.shared{background:#f4f5fa;color:#69707a;font-weight:600}
.idl{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap;background:#f4f5fa;color:#69707a;border:1px dashed #c9ced8}
tr.idle td.nm b{color:#69707a}
.pg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:help}
.pg u{display:inline-block;width:54px;height:6px;border-radius:999px;background:#eef0f6;overflow:hidden;text-decoration:none}
.pg u b{display:block;height:100%;background:#7c4dc4}
td.ex{min-width:150px;max-width:300px;font-size:12px;color:#4a5158;line-height:1.5}
tr.shr td{background:#fafbfd;color:#69707a}
.wlerr{font-size:12.5px;color:#b3261e;background:#fdf0ef;border-radius:10px;padding:6px 12px}
tr.shr td.nm b{white-space:nowrap}
td.ex .exb{display:block;width:100%;margin:0;padding:0;border:0;background:none;font:inherit;color:inherit;text-align:left;line-height:inherit;cursor:default}
/* iPad held upright and narrower (768-834 px): the start / stop buttons stack and stay at the right edge (sticky), the
   explanation is 3 lines at most (tap it for the whole text), so a teacher never has to swipe the table sideways */
@media(max-width:900px){
  .wlv table.tt th,.wlv table.tt td{padding-left:6px;padding-right:6px}

}

const I=n=>'<svg class="si" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+IC[n]+'</svg>';  // single-colour Lucide icons (ISC), owner 2026-10-07: no emoji

const LVC={L1:'#3d5699',L2:'#2f8f6b',L3:'#d9772e',L4:'#7c4dc4',yai:'#2ea052'};

async function reg(path,body){
  const o={credentials:'same-origin'};
  if(body!==undefined){o.method='POST';o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(body);}
  let r,j={};
  try{r=await fetch('/api/reg/'+path,o);try{j=await r.json();}catch(e){}}catch(e){return {ok:false,error:'連線錯誤，請稍後再試。'};}
  if(r.status===401){location.href='/login.html';return {ok:false,error:''};}
  if(!j.ok&&!j.error)j.error='操作失敗（'+r.status+'）';
  return j;
}
/* dates: 'YYYY-MM-DD' strings, read as local calendar days */
function dt(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function wd(s){return WD[dt(s).getDay()];}
function md(s){const d=dt(s);return (d.getMonth()+1)+'月'+d.getDate()+'日';}
function fd(s){return s+'（'+wd(s)+'）';}
function tm(x){return x&&x.start?x.start+'–'+x.end:'';}
function nextSession(s){const t=iso(new Date());return (s||[]).find(x=>x.date>=t)||null;}

function tdate(ts){if(!ts)return '';const d=new Date(ts*1000);return iso(d);}

}

async function route(){
  const h=decodeURIComponent(location.hash.slice(1));const i=h.indexOf('/');
  let v=i<0?h:h.slice(0,i);const arg=i<0?'':h.slice(i+1);
  if(!v)v=ME.legacy?'library':'classes';
  nav(v);window.scrollTo(0,0);document.body.classList.remove('fullh');wlStop();
  // everything that matters on a page is in the URL, so a refresh lands on the same page:
  // #classes[/archived] · #class/<id>[/<材料分頁>] · #library/<級>[/<材料分頁>] · #preview/<級>/<班>/<課> · #wlab/<班>[/<課>]
  const [a0,a1]=arg.split('/');
  try{
    if(v==='class'&&a0){await viewClass(a0);return openSec(a1);}
    if(v==='wlab'&&a0)return await viewWlab(a0,a1);
    if(v==='preview'&&arg)return await viewPreview(arg);
    if(v==='teachers'&&ME.admin)return await viewTeachers();
    if(v==='library'&&(ME.admin||ME.legacy)){viewLibrary(a0);return openSec(a1);}
    SHOW_ARCH=(v==='classes'&&arg==='archived');
    return await viewClasses();
  }catch(e){}
}

async function viewClasses(){
  const el=$('view');
  if(ME.legacy){
    el.innerHTML=`<div class="empty">此為共用帳號：可在「教材庫」使用所有級別的教材，但不能查看班級、學生名單及註冊碼。<br>

</span></h2>`;
  if(!list.length){

/* month calendar of every lesson of the classes listed above (week starts Monday) */
function renderCal(){
  const box=$('cal');if(!box)return;
  const [y,m]=CAL_M.split('-').map(Number),first=new Date(y,m-1,1),today=iso(new Date());
  const ev={};CAL_LIST.forEach(c=>(c.sessions||[]).forEach(x=>{(ev[x.date]=ev[x.date]||[]).push({c,x});}));
  Object.values(ev).forEach(a=>a.sort((p,q)=>(p.x.start||'').localeCompare(q.x.start||'')));
  const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));

function parseLines(txt){
  const out=[],bad=[],p=n=>String(n).padStart(2,'0');
  txt.split('\n').map(s=>s.trim()).filter(Boolean).forEach(ln=>{
    const m=ln.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:\s+(\d{1,2}):(\d{2})\s*[-–~至]\s*(\d{1,2}):(\d{2}))?$/);
    if(!m){bad.push(ln);return;}
    const date=m[1]+'-'+p(m[2])+'-'+p(m[3]);
    out.push(m[4]?{date,start:p(m[4])+':'+m[5],end:p(m[6])+':'+m[7]}:{date,start:'',end:''});
  });
  return {out,bad};
}

    <div class="lvpick">${Object.entries(levels).map(([k,n])=>`<a href="#library/${k}" class="${k===lv?'on':''}">${lvTag(k)} ${esc(n)}</a>`).join('')}</div>
    ${['L1','L2','L3','L4'].includes(lv)?`<p style="margin:0 0 10px"><a class="btn sm pri" href="#preview/${lv}">學生視角預覽：${lv} 全部課堂</a></p>`:''}
    <section class="box lib"><div class="mats" id="secs"></div></section>`;
  document.body.classList.add('fullh');
  fileManager(lv,$('secs'));
}
/* teaching materials: download only (files are produced and published by the build pipeline, not uploaded here) */
function fileManager(level,el){
  CUR=level;
  el.innerHTML=`<div class="mtabs">${SECS.map((x,i)=>`<button type="button" class="mtab ${x.c}${i?'':' on'}" data-a="mtab" data-v="${x.k}">${x.ic} ${x.lb} <span class="cnt" id="cnt-${x.k}"></span></button>`).join('')}</div>
    ${SECS.map((x,i)=>`<div class="mlist${i?'':' on'}" id="list-${x.k}" data-note="${esc(x.nt)}"></div>`).join('')}`;
  SECS.forEach(x=>load(x.k));
}
function fmt(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':b>=1024?(b/1024).toFixed(0)+' KB':b+' B';}
async function load(sec){
  const el=$('list-'+sec),cnt=$('cnt-'+sec);if(!el)return;el.innerHTML='<div class="fempty">載入中…</div>';
  let r,j;try{r=await api('fm/list?class='+CUR+'&section='+sec);j=await r.json();}catch(e){el.innerHTML='<div class="fempty">載入失敗</div>';return;}
  if(!r.ok){el.innerHTML='<div class="fempty">你沒有此級別教材的權限。</div>';return;}
  const files=j.files||[];cnt.textContent=files.length;
  el.innerHTML=`<div class="mnote">${esc(el.dataset.note)}</div>`+(files.length?files.map(f=>{const url='/files/'+CUR+'/'+sec+'/'+encodeURIComponent(f.name);
    return `<a class="frow" href="${url}" target="_blank" rel="noopener"><span class="nm">${esc(f.name)}</span><span class="sz">${fmt(f.size)}</span><span class="fdl">${I('download')}</span></a>`;}).join(''):'<div class="fempty">尚無檔案</div>');
}
function mtab(k,fromUrl){document.querySelectorAll('.mtab').forEach(b=>b.classList.toggle('on',b.dataset.v===k));
  document.querySelectorAll('.mlist').forEach(l=>l.classList.toggle('on',l.id==='list-'+k));
  if(fromUrl)return;
  const h=location.hash.slice(1).split('/');
  if((h[0]==='class'||h[0]==='library')&&h[1])setUrl('#'+h[0]+'/'+h[1]+'/'+k);}

/* ---------------- Wonder Lab 課堂控制 (L4 classes, owner 2026-10-07: "Let the teacher control from teacher portal, student by student")
   #wlab/<班>[/<課>] · data: /api/ai/lab/teacher/<班>[/<課>] (iits-lesson-ai; no AI call). Refreshes every 10 s while open.
   開始整合 = the student's Wonder Lab shows the AI's first wrap-up question within about 20 s, without the student typing. */
const WLS={off:'自由探索',pending:'整合 · 等待學生',step1:'整合 · 第 1 步',step2:'整合 · 第 2 步',done:'已完成整合'};
let WL={cid:'',les:'',t:null,d:null,busy:false,open:new Set()};
async function wlApi(path,body){
  const o={credentials:'same-origin'};
  if(body!==undefined){o.method='POST';o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(body);}
  let r,j={};
  try{r=await fetch('/api/ai/lab/teacher/'+path,o);try{j=await r.json();}catch(e){}}catch(e){return {ok:false,net:true,error:'連線中斷，稍後會自動再試。'};}
  if(r.status===401){location.href='/login.html';return {ok:false,error:''};}
  if(!j.ok)j.error=j.reason||(r.status===403?'你沒有此班級的權限。':r.status===404?'找不到這一課的 Wonder Lab。':'暫時未能讀取（'+r.status+'）');
  j.status=r.status;return j;
}
function wlStop(){clearInterval(WL.t);WL.t=null;}
function ago(ts,now){if(!ts)return '—';const s=Math.max(0,now-ts);
  if(s<5)return '剛剛';
  if(s<3600)return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+' 前';
  return s<86400?Math.floor(s/3600)+' 小時前':md(iso(new Date(ts*1000)));}
async function viewWlab(cid,les){
  wlStop();WL={cid,les:/^[a-z0-9]+-bp\d+$/.test(les||'')?les:'',t:null,d:null,busy:false,open:new Set()};
  const el=$('view'),back=`<a class="back" href="#class/${encodeURIComponent(cid)}">← 返回班級</a>`;
  el.innerHTML='<div class="empty">載入中…</div>';
  if(!WL.les){
    const j=await wlApi(encodeURIComponent(cid));
    if(!j.ok){el.innerHTML=back+`<div class="empty">${esc(j.error)}</div>`;return;}
    if(!j.lessons.length){el.innerHTML=back+'<div class="empty">此級別暫未有已開放的 Wonder Lab 課堂。</div>';return;}
    WL.les=j.suggest||j.lessons[0].slug;setUrl('#wlab/'+encodeURIComponent(cid)+'/'+WL.les);
  }
  await wlLoad();
  if(WL.cid===cid)WL.t=setInterval(()=>{if(!document.hidden)wlLoad(true);},10000);
}
async function wlLoad(quiet){
  if(WL.busy)return;WL.busy=true;const cid=WL.cid,les=WL.les,ind=$('wlr');
  if(ind)ind.classList.add('busy');
  const j=await wlApi(encodeURIComponent(cid)+'/'+les);
  WL.busy=false;
  if(cid!==WL.cid||les!==WL.les||!location.hash.startsWith('#wlab/'))return;
  if(!j.ok){
    if(WL.d&&quiet&&($('wlr'))){const r=$('wlr');r.classList.remove('busy');r.classList.add('off');r.innerHTML=I('refresh-cw')+' '+esc(j.error);return;}
    $('view').innerHTML=`<a class="back" href="#class/${encodeURIComponent(cid)}">← 返回班級</a><div class="empty">${esc(j.error)}</div>`;WL.d=null;return;
  }
  const first=!WL.d||!$('wltb');WL.d=j;wlRender(j,first);
}
function wlRender(d,first){
  const c=d.class,now=d.now||Math.floor(Date.now()/1000),rows=d.rows||[],kids=rows.filter(r=>!r.shared),ok=c.status==='active';
  const tl=d.cls?`<b>上課中</b> ${esc(d.cls.start)}–${esc(d.cls.end)} · 尚餘 ${Math.max(0,Math.round(d.cls.ends_in/60))} 分鐘`
    :d.next?`下一課：${esc(md(d.next.date))}（${wd(d.next.date)}）${esc(d.next.start)}–${esc(d.next.end)}`:'現在不是上課時間';
  if(first){
    $('view').innerHTML=`<div class="wlv">
  <header class="wlh"><a class="back" href="#class/${encodeURIComponent(c.id)}" title="返回班級">←</a>
    <div><h1>${I('flask-conical')} Wonder Lab 課堂控制 ${lvTag(c.level)}</h1><div class="wlt" id="wltl"></div></div>
    <label class="wlpick">課堂 <select id="wlles">${d.lessons.map(x=>`<option value="${esc(x.slug)}"${x.slug===d.lesson.slug?' selected':''}>${esc(x.slug+' '+x.title)}</option>`).join('')}</select></label>
    <span class="wlr" id="wlr" title="每 10 秒自動更新，不會使用 AI"></span></header>
  ${ok?'':'<div class="cpw">此班已封存，只可查看。</div>'}
  <div class="wlbar"><label class="wlsw"><input type="checkbox" id="wlauto"${ok?'':' disabled'}><i></i>學生達標時自動開始整合</label>
    <span class="wlhint">預設關閉：老師按「開始整合」才會開始。開啟後，學生的程式通過本課全部自動檢查時便會開始（每人每天一次）。</span>
    ${ok?`<span class="sp"><button class="btn sm pri" data-a="wlall">${I('play')} 全班開始整合</button><button class="btn sm warn" data-a="wlnone">${I('square')} 全班停止</button></span>`:''}</div>
  <p class="wlhint">按「開始整合」後，約 20 秒內該學生的 Wonder Lab 對話會出現 AI 學伴的整合提問，學生不用輸入。「停止整合」隨時讓學生回到自由探索。姓名及學生的解釋只有老師看到。</p>
  <section class="box"><h3>${I('backpack')} 學生 <span class="cnt" id="wlcnt"></span></h3><div class="scr tw">
    <table class="t tt"><thead><tr><th>姓名 · 登入名稱</th><th>最後活動</th><th>對話回合</th><th>執行次數</th><th>進度</th><th>卡住</th><th>階段</th><th>學生的解釋</th><th class="act"></th></tr></thead>
    <tbody id="wltb"></tbody></table></div></section></div>`;
  }
  $('wltl').innerHTML=esc(c.name)+' · '+tl;
  const au=$('wlauto');if(au&&document.activeElement!==au)au.checked=!!d.auto;
  const r=$('wlr');r.className='wlr';r.innerHTML=I('refresh-cw')+' 每 10 秒更新 · '+esc(new Date(now*1000).toLocaleTimeString('en-GB',{hour12:false}));
  const busy=kids.filter(x=>['pending','step1','step2'].includes(x.state)).length;
  $('wlcnt').textContent=kids.length+' 人'+(busy?' · 整合中 '+busy+' 人':'')+' · 回合及執行次數只計今天';
  $('wltb').innerHTML=rows.map(x=>wlRow(x,now,ok)).join('')||'<tr><td colspan="9" class="muted">此班暫未有學生帳戶。</td></tr>';
}
function wlRow(r,now,ok){
  const yes=r.check_names.filter(x=>x.ok).map(x=>x.label),no=r.check_names.filter(x=>!x.ok).map(x=>x.label);
  const tip=(yes.length?'已做到：'+yes.join('、'):'未有已做到的項目')+(no.length?'\n未做到：'+no.join('、'):'');
  const pct=r.checks_total?Math.round(100*r.checks_passed/r.checks_total):0;
  const pg=r.checks_total?`<span class="pg" title="${esc(tip)}"><u><b style="width:${pct}%"></b></u>${r.checks_passed}/${r.checks_total}</span>`:'—';
  // 未有嘗試 = no Wonder Lab turn today on this lesson: 全班開始整合 leaves such a student out (service: skipped_idle)
  const idle=!r.shared&&!r.turns;
  const head=`<td class="nm">${r.shared?I('users')+' ':''}<b>${esc(r.name||r.u)}</b><br><span class="mono muted">${esc(r.u)}</span></td><td class="small">${ago(r.last_ts,now)}${idle?'<br><span class="idl" title="今天未在這一課用過 Wonder Lab：全班開始整合時不會開始">未有嘗試</span>':''}</td><td>${r.turns}</td><td>${r.runs}</td><td>${pg}</td>`;
  if(r.shared)return `<tr class="shr">${head}<td>—</td><td colspan="3"><span class="stg shared">共用帳戶：無法逐個學生控制</span></td></tr>`;
  const on=['pending','step1','step2'].includes(r.state);
  return `<tr data-u="${esc(r.u)}"${idle?' class="idle"':''}>${head}<td>${r.stuck?`<span class="warn">${r.stuck} 次</span>`:'0'}</td><td><span class="stg ${esc(r.state)}">${WLS[r.state]||esc(r.state)}</span></td>
    <td class="ex">${r.explain?`<button type="button" class="exb${WL.open.has(r.u)?' open':''}" data-a="wlex" data-v="${esc(r.u)}" aria-expanded="${WL.open.has(r.u)}" title="${esc(r.explain)}"><span class="exq">${esc(r.explain)}</span></button>`:'<span class="muted">—</span>'}</td>
    <td class="act">${ok?`<button class="btn sm${on?'':' pri'}" data-a="wlgo" data-v="${esc(r.u)}"${r.state==='pending'?' disabled':''}>${I(r.state==='off'?'play':'rotate-ccw')} ${r.state==='off'?'開始整合':'再開始'}</button>`+
      `<button class="btn sm warn" data-a="wlstop" data-v="${esc(r.u)}"${r.state==='off'?' disabled':''}>${I('square')} 停止整合</button>`:''}</td></tr>`;
}
async function wlAct(body,done,b){
  if(b)b.disabled=true;
  const j=await wlApi(encodeURIComponent(WL.cid)+'/'+WL.les,body);
  if(b)b.disabled=false;
  if(!j.ok){toast(j.error);return;}
  toast(done(j));await wlLoad(true);
}
function wlName(u){const r=((WL.d&&WL.d.rows)||[]).find(x=>x.u===u);return r&&r.name?r.name:u;}
function wlGo(u,b){wlAct({action:'start',users:[u]},()=>'已開始整合：'+wlName(u),b);}
function wlHalt(u,b){wlAct({action:'stop',users:[u]},()=>'已停止整合：'+wlName(u),b);}
function wlAll(on,b){
  const kids=((WL.d&&WL.d.rows)||[]).filter(x=>!x.shared),n=kids.filter(x=>x.turns>0).length,idle=kids.length-n;
  if(on&&!confirm('全班開始整合？\n'+n+' 位今天有嘗試的學生，Wonder Lab 會在約 20 秒內出現 AI 學伴的整合提問（學生不用輸入）。'+
    (idle?'\n'+idle+' 人今天未有嘗試，不會開始。':'')+'\n正在整合的學生會重新開始。'))return;
  if(!on&&!confirm('全班停止整合？\n所有學生回到自由探索。'))return;
  wlAct({action:on?'start':'stop',users:'all'},j=>(on?'已開始整合：':'已停止整合：')+j.changed+' 人'+(on&&j.skipped_idle?'；'+j.skipped_idle+' 人今天未有嘗試，未開始整合':''),b);
}
document.addEventListener('change',e=>{
  if(e.target.id==='wlauto'){const v=e.target.checked;wlAct({auto:v},()=>v?'已開啟：學生達標時自動開始整合':'已關閉自動整合');}
  else if(e.target.id==='wlles'){WL.les=e.target.value;WL.d=null;setUrl('#wlab/'+encodeURIComponent(WL.cid)+'/'+WL.les);wlLoad();}
});

/* ---------------- one click handler for the data-a buttons ---------------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='new')editClass(null);else if(a==='edit')editClass(v);else if(a==='save')saveClass(v,b);else if(a==='gen')genDates();
  else if(a==='close')$('dlg').close();else if(a==='status')setStatus(v,b.dataset.s);else if(a==='copy')copyCode();
  else if(a==='mtab')mtab(v);
  else if(a==='calp')calShift(-1);else if(a==='caln')calShift(1);else if(a==='calt'){CAL_M=iso(new Date()).slice(0,7);renderCal();}
  else if(a==='rotate')rotate(v);else if(a==='arch'){SHOW_ARCH=!SHOW_ARCH;setUrl('#classes'+(SHOW_ARCH?'/archived':''));viewClasses();}
  else if(a==='assign')assign(v);else if(a==='saveassign')saveAssign(v,b);
  else if(a==='mkadmin')tUpdate(v,{admin:true},'已設為管理員','把 '+v+' 設為管理員？\n管理員可管理全部班級、教師及批核申請。');
  else if(a==='rmadmin')tUpdate(v,{admin:false},'已取消管理員身分','取消 '+v+' 的管理員身分？');
  else if(a==='disable')tUpdate(v,{disabled:true},'已停用','停用 '+v+'？對方將不能登入（可隨時啟用）。');
  else if(a==='enable')tUpdate(v,{disabled:false},'已啟用');
  else if(a==='approve')decide(v,'approve');else if(a==='decline')decide(v,'decline');
  else if(a==='wlex'){if(WL.open.has(v))WL.open.delete(v);else WL.open.add(v);b.classList.toggle('open',WL.open.has(v));b.setAttribute('aria-expanded',WL.open.has(v));}
  else if(a==='wlgo')wlGo(v,b);else if(a==='wlstop')wlHalt(v,b);else if(a==='wlall')wlAll(true,b);else if(a==='wlnone')wlAll(false,b);
});

(async()=>{
  let r;try{r=await api('me');}catch(e){$('view').innerHTML='<div class="empty">連線錯誤，請稍後再試。</div>';return;}
  if(!r.ok){location.href='/login.html';return;}
  ME=await r.json();ME.levels=ME.levels||[];
  $('who').innerHTML=esc(ME.name)+(ME.admin?'<span class="badge">管理員</span>':ME.legacy?'<span class="badge" style="background:#eef1f8;color:#4a5158;border-color:#d7dced">共用帳號</span>':'');
  route();
})();
